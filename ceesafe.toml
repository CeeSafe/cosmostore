[package]
name = "cosmostore"
version = "0.0.1"
kind = "executable"
sources = ["src"]
ceesafec = ">=0.20.0"        # CeeSafe ADR 0076; 0.19.1 is the first with what durable.cee needs

[dependencies]
web_core = { path = "../../CeeSafe.Web/packages/web_core" }
web_transport = { path = "../../CeeSafe.Web/packages/web_transport" }
web_http = { path = "../../CeeSafe.Web/packages/web_http" }
web_server = { path = "../../CeeSafe.Web/packages/web_server" }
# TLS (ADR-0016): OpenSSL 3 through web_tls's C shim. CosmoStore's own code still calls no C and has no `unsafe`.
web_tls = { path = "../../CeeSafe.Web/packages/web_tls" }
